---
layout: default
title: Reading List
---

<div class="main-wrapper">
  <section id="readinglist" class="pull-left">
    <h2 class='section-title'>Reading List*</h2>

    <ol>
      {% for book in site.data.books %}
      <li>
      <span class="gray">{{book.author}}</span>. {{book.title}}. <span class="gray">{{book.publisher}}</span>, <span class="gray">{{book.year}}</span>
      </li>
      {% endfor %}
    </ol>
    <p>More to come...</p>
    <small class='hint'>* Books in different ranges of topics and there is no specific ordering.</small>
  </section>
  <div class="clear"></div>

</div>
