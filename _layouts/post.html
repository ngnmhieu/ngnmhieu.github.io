---
layout: default
---

<div class="post">
  <div class="post-header">
    <h2 class="pull-left"><a href="{{page.url}}">{{ page.title }}</a></h2>
    <p class="meta pull-right">{{ page.date | date_to_string }}</p>
    <div class="clear"></div>
  </div>

  <hr class="separator">
  {{ content }}
</div>
