---
layout: default
title: Archives
---

<div class="main-wrapper ">
  <section id="blogposts">
    <h2>Archives</h2>
    <ul class="posts">
      {% for post in site.posts %}
      <li><span>{{ post.date | date_to_string }}</span> &raquo; <a href="{{ post.url }}">{{ post.title }}</a></li>
      {% endfor %}
    </ul>
  </section>
</div>
