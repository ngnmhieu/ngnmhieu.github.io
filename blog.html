---
layout: default
title: Blog
---

{% for post in site.posts %}
<div class="post">
  <div class="post-header">
    <h2 class="pull-left"><a href="{{post.url}}">{{ post.title }}</a></h2>
    <p class="meta pull-right">{{ post.date | date_to_string }}</p>
    <div class="clear"></div>
  </div>

  <hr class="separator">
  {{ post.content }}
  <a href="{{post.url}}" class="pull-right">Comments</a>
</div>
{% endfor %}
